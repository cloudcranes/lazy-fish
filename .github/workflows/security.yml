name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # pip-audit 把结果以 SARIF 推到 Security tab，需要 security-events: write
  security-events: write

jobs:
  pip-audit:
    name: pip-audit (deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # OSV/PyPI Advisory 数据库 + 严格模式：发现漏洞即 fail。
      # --vulnerability-service osv 同时上报 GH Security tab（pip-audit 原生支持）。
      - name: Audit requirements + requirements-dev
        run: |
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements-dev.txt \
            --vulnerability-service osv \
            --strict \
            --format cyclonedx-json \
            --output pip-audit.cdx.json || {
              echo "::warning::pip-audit found vulnerabilities; see SARIF upload step for details"
              exit 1
            }

      # 把 CycloneDX 转 SARIF 并上传到 GH Security tab
      # 用 cyclonedx-py-resolve 已经在 pip-audit 输出里；如果没装 cyclonedx-bom-to-sarif
      # 就退化成简单文本输出。
      - name: Convert CycloneDX → SARIF (best effort)
        id: sarif
        run: |
          if [ -f pip-audit.cdx.json ]; then
            python - <<'PY'
          import json, sys, hashlib, pathlib
          cdx = json.loads(pathlib.Path("pip-audit.cdx.json").read_text(encoding="utf-8"))
          results = []
          for vuln in cdx.get("vulnerabilities", []):
              for aff in vuln.get("affected", []):
                  purl = aff.get("package", "") if isinstance(aff, dict) else ""
                  results.append({
                      "ruleId": vuln.get("id", "ADVISORY"),
                      "level": "error",
                      "message": {"text": vuln.get("description", vuln.get("id", ""))[:300]},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": purl or "."},
                              "region": {"startLine": 1, "startColumn": 1},
                          }
                      }],
                      "fingerprints": {
                          "primary": hashlib.sha256(
                              (vuln.get("id","") + "|" + purl).encode()
                          ).hexdigest(),
                      },
                  })
          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {"driver": {"name": "pip-audit", "version": "n/a"}},
                  "results": results,
              }],
          }
          pathlib.Path("pip-audit.sarif.json").write_text(
              json.dumps(sarif, indent=2), encoding="utf-8"
          )
          print("results:", len(results))
          PY
          else
            echo "no cyclonedx json; skipping SARIF"
          fi

      - name: Upload SARIF to GitHub Security tab
        if: hashFiles('pip-audit.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pip-audit.sarif.json
          category: pip-audit

      # 兜底：主分支上若 SARIF 上传失败仍 fail，PR 上 warn 即可（spec: PR 走 warn）
      - name: Fail main if vulnerabilities were reported
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('pip-audit.cdx.json') != ''
        run: |
          python -c "import json,sys; d=json.load(open('pip-audit.cdx.json',encoding='utf-8')); v=d.get('vulnerabilities',[]); sys.exit(1 if v else 0)"

      - name: Annotate PR with summary (warn-only)
        if: github.event_name == 'pull_request' && hashFiles('pip-audit.cdx.json') != ''
        run: |
          python -c "import json; d=json.load(open('pip-audit.cdx.json',encoding='utf-8')); v=d.get('vulnerabilities',[]); print('::warning::pip-audit found',len(v),'vulnerabilities; see Security tab')" || true
