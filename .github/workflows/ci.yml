name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system deps (OpenCV runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libsm6 libxrender1 libxext6

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Smoke import
        run: |
          python -c "from xyzw_auto_clicker import matcher, runner, app; print('imports OK')"

      - name: Unit tests
        run: |
          python -m pytest tests/test_core.py -x -q

      # recognition_eval 需要 data/video.mp4 与 data/screenshots/，CI 上若没有真实语料会跳过
      - name: Recognition eval (if corpus present)
        run: |
          if [ -f data/video.mp4 ] && [ -d data/screenshots ]; then
            python tests/recognition_eval.py
          else
            echo "SKIP: recognition corpus not present in CI"
          fi
        continue-on-error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lazy-fish:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-run container
        run: |
          docker run --rm -d --name lazy-fish-ci -p 8999:8999 lazy-fish:ci
          sleep 8
          curl -fsS http://127.0.0.1:8999/ -o /dev/null
          docker stop lazy-fish-ci