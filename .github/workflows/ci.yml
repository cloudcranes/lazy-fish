name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff + pyright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR 上 lint 出问题只 warn，不阻塞合并；main 上 fail-fast。
    # 真正质量门由 track-a-engineer 在 PR-7 把关；这里给后来人留快速反馈。
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff check .
        run: ruff check .

      - name: pyright strict (against pyright-baseline.json)
        run: python scripts/pyright_check.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    # PR 上单测失败也只 warn，main 上 fail-fast。
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system deps (OpenCV runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Smoke import
        run: |
          python -c "from xyzw_auto_clicker import matcher, runner, app; print('imports OK')"

      - name: Unit tests
        run: |
          python -m pytest tests/ -x -q

      # recognition_eval 需要 data/video.mp4 与 data/screenshots/，CI 上若没有真实语料会跳过
      - name: Recognition eval (if corpus present)
        run: |
          if [ -f data/video.mp4 ] && [ -d data/screenshots ]; then
            python tests/recognition_eval.py
          else
            echo "SKIP: recognition corpus not present in CI"
          fi
        continue-on-error: false

  # 说明：a11y / visual 与 docker 是独立 job（独立 runner），无法共享 localhost 端口，
  # 所以每个需要容器的 job 自己 build + run（见 a11y / visual 内的 Build & Run 步骤）。
  # docker job 只保留 build + smoke 自检。
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # PR 上用 PR 编号当 scope，多个 PR 互不污染；main 上保留 mode=max 的全局 cache。
      # 缓存只对 docker 任务本身有价值，不影响 test 任务。
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lazy-fish:ci
          cache-from: |
            type=gha,scope=${{ github.event.pull_request.number || 'main' }}
            type=gha,scope=main
          cache-to: |
            type=gha,scope=${{ github.event.pull_request.number || 'main' }},mode=max

      - name: Smoke-run container
        run: |
          docker run -d --name lazy-fish-ci -p 8999:8999 lazy-fish:ci
          sleep 8
          curl -fsS http://127.0.0.1:8999/api/health -o /dev/null \
            || { docker logs lazy-fish-ci; exit 1; }
          docker stop lazy-fish-ci

  # 说明：容器实例无法跨 job 共享（独立 runner 无共享 localhost），
  # 需要应用的 job（a11y / visual）各自 build + run（见各 job 内 Build & Run）。
  # 本 job 不再存在 —— docker job 已承担 build + smoke 自检。

  a11y:
    name: axe-core 自动 a11y
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    # 从 PR-17 起升级为合并门槛：PR + main 都 fail-fast。
    # 之前的 `continue-on-error: ${{ github.event_name == 'pull_request' }}` 是 PR-10
    # 引入期的过渡策略；axe-core 噪音（重复 landmark、装饰 SVG 等 moderate/minor 误报）
    # 清完后即可摘掉，与 lint / test job 的「PR 上 warn、main 上 fail」语义脱钩。
    # 判失败口径仍是 serious·critical（moderate/minor 只打印不阻塞）。

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install UI test deps
        # 仓根 package.json 已声明 @axe-core/playwright + playwright，
        # workspaces 自动把依赖下发到 tests/ui/node_modules。
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build & run lazy-fish container
        run: |
          docker build -t lazy-fish:a11y .
          docker run -d --name lazy-fish-a11y -p 8999:8999 lazy-fish:a11y

      - name: Wait for lazy-fish
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8999/api/health -o /dev/null; then
              echo "lazy-fish is up"
              exit 0
            fi
            sleep 2
          done
          echo "lazy-fish not reachable on 8999"
          docker logs lazy-fish-a11y || true
          exit 1

      - name: Run axe-core over 5 views
        run: node tests/ui/a11y.mjs

      - name: Teardown container
        if: always()
        run: docker stop lazy-fish-a11y || true

  visual:
    name: 视觉回归（playwright 截图 + pixelmatch）
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    # 从 PR-20 起升级为合并门槛：PR + main 都 fail-fast。
    # 之前的 `continue-on-error: ${{ github.event_name == 'pull_request' }}` 是 PR-18
    # 引入期的过渡策略；baseline 已稳定（playwright chromium 锁 1.49.x 主线，跨平台字体差异收敛），
    # 与 a11y job 同语义——「PR 上即阻塞」，与 release 流程同等级。
    # baseline 变动必须走 PR + 人工审 diff 图，禁直推 main 重生成。

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install UI test deps
        # 仓根 package.json 已声明 pixelmatch / pngjs / fs-extra（@axe-core / playwright 沿用），
        # workspaces 自动把依赖下发到 tests/ui/node_modules。
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build & run lazy-fish container
        run: |
          docker build -t lazy-fish:visual .
          docker run -d --name lazy-fish-visual -p 8999:8999 lazy-fish:visual

      - name: Wait for lazy-fish
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8999/api/health -o /dev/null; then
              echo "lazy-fish is up"
              exit 0
            fi
            sleep 2
          done
          echo "lazy-fish not reachable on 8999"
          docker logs lazy-fish-visual || true
          exit 1

      - name: Run visual regression over 5 views
        # baseline 缺失 = 首次初始化，会写 PNG 并视为通过；
        # 已有 baseline = 按 0.1% 阈值比对。
        # 阈值与更新流程见 docs/UI-DESIGN.md §12。
        run: node tests/ui/visual.mjs

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/ui/diffs/

      - name: Teardown container
        if: always()
        run: docker stop lazy-fish-visual || true