name: Release

on:
  push:
    tags:
      - "xyzw-auto-clicker-v*.*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 0.2.0). For tag push this is ignored."
        required: true
        type: choice
        default: "v0.1.0"
        options:
          - "v0.1.0"
          - "v0.2.0"
          - "v0.3.0"
          - "v0.4.0"
          - "v0.5.0"
          - "v0.6.0"
          - "v0.7.0"
          - "v0.8.0"
          - "v0.9.0"
          - "v1.0.0"
          - "v1.0.1"
          - "v1.1.0"
          - "v1.2.0"
          - "v1.3.0"
          - "v1.4.0"
          - "v1.5.0"
          - "v1.6.0"
          - "v1.7.0"
          - "v1.8.0"
          - "v1.9.0"
          - "v2.0.0"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual dispatch: use the version supplied via workflow_dispatch input,
            # stripping the optional leading 'v'. If a tag for that version already
            # exists on the remote, we still tag the image with it — the operator is
            # explicitly asking for that version.
            RAW="${INPUTS_VERSION:-${GITHUB_SHA:0:7}}"
            VERSION="${RAW#v}"
          else
            # Tag push: ${GITHUB_REF_NAME} is the v*.*.* or xyzw-auto-clicker-v*.*.*
            # tag; strip the leading 'v' and any component prefix.
            VERSION="${GITHUB_REF_NAME#xyzw-auto-clicker-v}"
            VERSION="${VERSION#v}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "TAG=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # GHCR login is needed for BOTH the tag-push path (canonical release)
        # AND the manual dispatch path (explicit operator-initiated publish).
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/cloudcranes/lazy-fish:${{ steps.version.outputs.VERSION }}
            ghcr.io/cloudcranes/lazy-fish:latest
          labels: |
            org.opencontainers.image.title=lazy-fish
            org.opencontainers.image.description=Salted Fish King chest-event auto-clicker
            org.opencontainers.image.source=https://github.com/cloudcranes/lazy-fish
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        # Tag push uses the real ref tag; manual dispatch uses inputs.version (prefixed
        # with 'v'). Both paths are independent — dispatch can publish a GH Release on
        # demand using the operator-supplied version.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
          generate_release_notes: ${{ github.event_name == 'push' }}
          body: |
            ## Docker

            ```bash
            docker pull ghcr.io/cloudcranes/lazy-fish:${{ steps.version.outputs.VERSION }}
            docker run --rm -p 8999:8999 \
              -v "$PWD/data:/app/data" \
              ghcr.io/cloudcranes/lazy-fish:${{ steps.version.outputs.VERSION }}
            ```

            Or use `docker compose up -d` against this repository.
          files: |
            LICENSE