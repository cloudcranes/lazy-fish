name: Release

on:
  # release-please 用 API 建 tag/release，push:tags 不触发；
  # release:published 覆盖该路径（自动化主路径）。push:tags 保留兼容手动打 tag。
  push:
    tags:
      - "xyzw-auto-clicker-v*.*.*"
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0 or v0.2.0). For tag/release events this is ignored."
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            # release:published —— tag 名即版本；release-please 自动发版主路径
            VERSION="${GITHUB_REF_NAME#xyzw-auto-clicker-v}"
            VERSION="${VERSION#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual dispatch: use the version input; strip optional leading 'v'.
            RAW="${{ inputs.version }}"
            RAW="${RAW:-${GITHUB_SHA:0:7}}"
            VERSION="${RAW#v}"
          else
            # Tag push: ${GITHUB_REF_NAME} is the v*.*.* or xyzw-auto-clicker-v*.*.*
            # tag; strip the leading 'v' and any component prefix.
            VERSION="${GITHUB_REF_NAME#xyzw-auto-clicker-v}"
            VERSION="${VERSION#v}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "TAG=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # GHCR login is needed for BOTH the tag-push path (canonical release)
        # AND the manual dispatch path (explicit operator-initiated publish).
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/cloudcranes/lazy-fish:${{ steps.version.outputs.VERSION }}
            ghcr.io/cloudcranes/lazy-fish:latest
          labels: |
            org.opencontainers.image.title=lazy-fish
            org.opencontainers.image.description=Salted Fish King chest-event auto-clicker
            org.opencontainers.image.source=https://github.com/cloudcranes/lazy-fish
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        # 仅 tag push 路径建 release（tag 不存在时）；release:published 由
        # release-please 已建；dispatch 只补镜像，不重复建 release。
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Docker

            ```bash
            docker pull ghcr.io/cloudcranes/lazy-fish:${{ steps.version.outputs.VERSION }}
            docker run --rm -p 8999:8999 \
              -v "$PWD/data:/app/data" \
              ghcr.io/cloudcranes/lazy-fish:${{ steps.version.outputs.VERSION }}
            ```

            Or use `docker compose up -d` against this repository.
          files: |
            LICENSE