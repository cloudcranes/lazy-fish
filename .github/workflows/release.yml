name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "TAG=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/cloudcranes/lazy-fish:${{ steps.version.outputs.VERSION }}
            ghcr.io/cloudcranes/lazy-fish:latest
          labels: |
            org.opencontainers.image.title=lazy-fish
            org.opencontainers.image.description=Salted Fish King chest-event auto-clicker
            org.opencontainers.image.source=https://github.com/cloudcranes/lazy-fish
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate changelog excerpt
        if: github.event_name == 'push'
        id: changelog
        run: |
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || echo "")
          if [ -z "${PREV}" ]; then
            RANGE="${GITHUB_SHA}^"
          else
            RANGE="${PREV}..${GITHUB_SHA}"
          fi
          {
            echo "## What's changed"
            echo
            echo "Image: \`ghcr.io/cloudcranes/lazy-fish:${VERSION}\`"
            echo
            echo "### Commits"
            echo
            git log "${RANGE}" --pretty=format:"- %s (%h)" --no-merges
          } >> "${GITHUB_OUTPUT}"
          echo "BODY<<EOF" >> "${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT_FILE}" >> "${GITHUB_OUTPUT}" 2>/dev/null || true
          echo "EOF" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Docker

            ```bash
            docker pull ghcr.io/cloudcranes/lazy-fish:${{ steps.version.outputs.VERSION }}
            docker run --rm -p 8999:8999 \
              -v "$PWD/data:/app/data" \
              ghcr.io/cloudcranes/lazy-fish:${{ steps.version.outputs.VERSION }}
            ```

            Or use `docker compose up -d` against this repository.
          files: |
            LICENSE